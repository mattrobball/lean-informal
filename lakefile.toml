name = "informal"
version = "0.1.0"
keywords = ["documentation", "formalization"]
description = "Attribute for pairing formal Lean declarations with paper references"

# Without this, bare `lake build` reports "no targets specified and no default
# targets configured", builds nothing, and exits 0 -- a green build that
# checked nothing.
defaultTargets = ["Informal", "extract_decls"]

# verso tags track Lean minor versions, so v4.32.0 is the tag for the whole
# v4.32.x line -- there is no v4.32.1. Lake builds every dependency with the
# ROOT toolchain (lean-toolchain here), so both of these compile under
# v4.32.1 regardless of the toolchain files in their own tags.
[[require]]
name = "verso"
git = "https://github.com/leanprover/verso"
rev = "v4.32.0"

# Pinned rather than left on main: main currently pins v4.29.0-rc7, which is
# what held this package back on 4.29.
[[require]]
name = "subverso"
git = "https://github.com/leanprover/subverso"
rev = "verso-v4.32.0"

# The standalone-file emitter and the dependency/classification helpers this
# package shares with it. Split out into its own repository because it needs
# Lean core only: a downstream project wanting a trusted-base file should not
# have to build verso and friends to get one, and the emitter should not
# inherit the toolchain-tied verso pins above.
[[require]]
name = "stan"
git = "https://github.com/mattrobball/lean-stan"
rev = "v0.2.1"

[[lean_lib]]
name = "Informal"

[[lean_lib]]
name = "Test"
globs = ["Test.+"]

[[lean_exe]]
name = "extract_decls"
root = "ExtractDecls"
supportInterpreter = true
