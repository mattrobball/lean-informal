name = "tfb"
version = "0.1.0"
keywords = ["formalization", "audit"]
description = "Emit a project's trusted formalization base as a standalone Lean file"
defaultTargets = ["TFB", "tfb_skeleton", "tfb_boundary"]

# Deliberately no dependencies. Every module here needs Lean core and nothing
# else, which is the point of splitting this out of `informal`: that package
# pulls verso, subverso, illuminate, MD4Lean and plausible for its Verso
# block support, none of which the emitters touch. A downstream project that
# only wants a trusted-base file should not have to build any of it.
#
# Keep it that way. If something here starts needing verso, it belongs in
# `informal` instead.

[[lean_lib]]
name = "TFB"

[[lean_exe]]
name = "tfb_skeleton"
root = "TFBSkeleton"
supportInterpreter = true

[[lean_exe]]
name = "tfb_boundary"
root = "TFBBoundary"
supportInterpreter = true
